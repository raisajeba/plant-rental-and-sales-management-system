<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Service Maintenance | Green Forest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
</head>
<body data-page="nursery-maintenance" data-layout="nursery">
  <div class="app-layout">
    <aside class="sidebar" id="nurserySidebar"></aside>

    <div class="main">
      <header class="topbar">
        <h1>Nursery Service & Maintenance Management</h1>
      </header>

      <div class="content">
        <div id="message" class="alert hidden"></div>

        <section class="card">
          <h3>Schedule Maintenance</h3>
          <form id="serviceRecordForm" novalidate>
            <div class="form-row">
              <div class="form-group">
                <label for="plantCustomer">Customer plant</label>
                <select id="plantCustomer" required>
                  <option value="">Loading associated plants...</option>
                </select>
              </div>
              <div class="form-group">
                <label for="serviceType">Task</label>
                <select id="serviceType">
                  <option value="watering">Watering</option>
                  <option value="fertilizing">Fertilizing</option>
                  <option value="pruning">Pruning</option>
                  <option value="repotting">Repotting</option>
                  <option value="pest_control">Pest control</option>
                  <option value="other">Other</option>
                </select>
              </div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label for="serviceDate">Scheduled date</label>
                <input type="date" id="serviceDate" />
              </div>
              <div class="form-group">
                <label for="serviceDescription">Maintenance details</label>
                <textarea id="serviceDescription" class="compact" maxlength="1000" minlength="10" required></textarea>
              </div>
            </div>
            <button type="submit" class="btn btn-primary" id="serviceSubmit">Create record</button>
          </form>
        </section>

        <section class="card section-gap">
          <div class="card-head"><h3>Maintenance History</h3></div>
          <div class="table-wrap">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Plant / task</th>
                  <th>Customer</th>
                  <th>Details</th>
                  <th>Scheduled date</th>
                  <th>Status</th>
                  <th>Update</th>
                </tr>
              </thead>
              <tbody id="nurseryMaintenanceTableBody">
                <tr class="empty-row"><td colspan="6">Loading maintenance history...</td></tr>
              </tbody>
            </table>
          </div>
        </section>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/pages/nursery-maintainance.js"></script>
</body>
</html>
