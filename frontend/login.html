<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login | Green Forest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="login" class="auth-page">
  <main class="auth-card">
    <div class="brand brand-center">
      <svg class="logo" viewBox="0 0 24 24" aria-hidden="true">
        <rect width="24" height="24" rx="6" fill="#0f4d1f" />
        <path d="M6 18c0-8 5-12 12-12 0 8-4 12-12 12z" fill="none" stroke="#fff" stroke-width="1.6" stroke-linejoin="round" />
        <path d="M6 18l7-7" stroke="#fff" stroke-width="1.6" stroke-linecap="round" />
      </svg>
      <span>Green Forest</span>
    </div>

    <h1>Welcome back</h1>
    <p class="subtitle">Log in to manage your plants.</p>

    <div id="message" class="alert hidden"></div>

    <form id="loginForm" novalidate>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@example.com" autocomplete="email" required />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Your password" autocomplete="current-password" required />
      </div>

      <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Log In</button>
    </form>

    <p class="switch-text">New here? <a href="register.html">Create an account</a></p>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
