<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>My Profile | Green Forest</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />

  <link
    href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap"
    rel="stylesheet"
  />

  <!-- Main CSS -->
  <link rel="stylesheet" href="css/style.css" />

  <!-- Dashboard CSS -->
  <link rel="stylesheet" href="css/dashboard.css" />
</head>

<body data-page="profile" data-layout="dashboard">

  <div class="app-layout">

    <aside class="sidebar" id="sidebar"></aside>


    <!-- ================= MAIN ================= -->

    <div class="main">

      <!-- Topbar -->
      <header class="topbar">

        <h1>
          My Profile
        </h1>

      </header>


      <!-- Content -->
      <div class="content">

        <!-- Welcome -->
        <section class="banner">

          <h2 id="welcomeTitle">
            Welcome back!
          </h2>

          <p>
            Manage your account details from one place.
          </p>

        </section>


        <!-- Message -->
        <div
          id="message"
          class="alert hidden"
        ></div>


        <!-- Profile Cards -->
        <div class="grid-2">


          <!-- ================= ACCOUNT DETAILS ================= -->

          <section class="card">

            <h3>
              Account Details
            </h3>

            <dl class="detail-list">

              <div>
                <dt>Name</dt>
                <dd id="detailName">-</dd>
              </div>


              <div>
                <dt>Email</dt>
                <dd id="detailEmail">-</dd>
              </div>


              <div>
                <dt>Role</dt>
                <dd id="detailRole">-</dd>
              </div>


              <div>

                <dt>Status</dt>

                <dd>

                  <span
                    class="badge"
                    id="detailStatus"
                  >
                    -
                  </span>

                </dd>

              </div>


              <div>
                <dt>Member since</dt>
                <dd id="detailCreated">-</dd>
              </div>


              <div>
                <dt>Last updated</dt>
                <dd id="detailUpdated">-</dd>
              </div>

            </dl>

          </section>


          <!-- ================= EDIT PROFILE ================= -->

          <section class="card">

            <h3>
              Edit Profile
            </h3>


            <form
              id="profileForm"
              novalidate
            >


              <!-- Name -->
              <div class="form-group">

                <label for="name">
                  Full name
                </label>

                <input
                  type="text"
                  id="name"
                  required
                />

              </div>


              <!-- Email -->
              <div class="form-group">

                <label for="email">
                  Email
                </label>

                <input
                  type="email"
                  id="email"
                  required
                />

              </div>


              <!-- Profile Picture -->
              <div class="form-group">

                <label for="profileImage">
                  Profile Picture
                </label>

                <input
                  type="file"
                  id="profileImage"
                  accept="image/jpeg,image/png,image/webp"
                />

              </div>


              <!-- Save -->
              <button
                type="submit"
                class="btn btn-dark btn-block"
                id="submitBtn"
              >
                Save Changes
              </button>

            </form>

          </section>

        </div>

      </div>

    </div>

  </div>


  <!-- JavaScript -->
  <script src="js/app.js"></script>
  <script src="js/layout.js"></script>

</body>

</html>
