<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dashboard | Green Forest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
</head>
<body data-page="dashboard" data-layout="dashboard">
  <div class="app-layout">

    <!-- Leave this empty; js/layout.js fills it automatically -->
    <aside class="sidebar" id="sidebar"></aside>

    <div class="main">
      <header class="topbar"><h1>Dashboard</h1></header>

      <div class="content">
        <div id="message" class="alert hidden"></div>

        <!-- Put your dashboard cards, welcome banner, and widgets here -->

      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script src="js/layout.js"></script>
</body>
</html>
