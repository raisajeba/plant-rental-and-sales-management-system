<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Purchase History | Green Forest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
</head>
<body data-page="customer-history" data-layout="dashboard">
  <div class="app-layout">
    <aside class="sidebar" id="sidebar"></aside>

    <div class="main">
      <header class="topbar">
        <h1>Purchase History</h1>
      </header>
      <div class="content">
        <div id="message" class="alert history-message hidden"></div>
        <section class="card history-card">
          <p class="page-intro">Review your plant purchases and rentals.</p>
          <div class="order-history-empty" id="orderHistoryEmpty" hidden>
            <span class="order-history-empty-icon" aria-hidden="true">🪴</span>
            <h2>No purchase history available yet</h2>
            <p>Your purchases and rentals will appear here after your first order.</p>
          </div>
          <div class="order-history-table-wrap" id="orderHistoryTableWrap">
            <table class="order-history-table">
              <thead>
                <tr>
                  <th scope="col">Order</th>
                  <th scope="col">Type</th>
                  <th scope="col">Plants</th>
                  <th scope="col">Total</th>
                  <th scope="col">Order date</th>
                  <th scope="col">Status</th>
                  <th scope="col">Details</th>
                </tr>
              </thead>
              <tbody id="orderHistoryBody">
                <tr><td colspan="7" class="order-history-state">Loading your history...</td></tr>
              </tbody>
            </table>
          </div>
        </section>
      </div>
    </div>
  </div>

  <dialog class="rental-payment-dialog" id="rentalPaymentDialog" aria-labelledby="rentalPaymentTitle">
    <form id="rentalPaymentForm">
      <div class="rental-payment-header">
        <div>
          <p class="buy-cart-eyebrow">APPROVED RENTAL</p>
          <h2 id="rentalPaymentTitle">Complete your payment</h2>
        </div>
        <button class="buy-cart-close" id="closeRentalPaymentButton" type="button" aria-label="Close payment form">×</button>
      </div>
      <p id="rentalPaymentSummary" class="rental-payment-summary"></p>
      <div class="payment-contact-fields">
        <label>Phone<input id="rentalPaymentPhone" type="tel" autocomplete="tel" required minlength="5" maxlength="20" pattern="[0-9+() -]+" /></label>
        <label>Address<input id="rentalPaymentAddress" type="text" autocomplete="street-address" required minlength="3" maxlength="200" /></label>
        <label>City<input id="rentalPaymentCity" type="text" autocomplete="address-level2" required minlength="2" maxlength="50" /></label>
        <label>Postcode<input id="rentalPaymentPostcode" type="text" autocomplete="postal-code" required minlength="3" maxlength="20" /></label>
      </div>
      <div class="rental-payment-actions">
        <button class="btn btn-reset" id="cancelRentalPaymentButton" type="button">Cancel</button>
        <button class="btn btn-primary" id="submitRentalPaymentButton" type="submit">Proceed to Payment</button>
      </div>
    </form>
  </dialog>

  <script src="js/app.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/pages/customer-history.js"></script>
</body>
</html>
