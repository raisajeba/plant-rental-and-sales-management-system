<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin | Green Forest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
</head>
<body data-page="admin" data-layout="admin">
  <div class="app-layout">
    <aside class="sidebar" id="sidebar"></aside>

    <div class="main">
      <header class="topbar"><h1>Admin</h1></header>
      <main class="content">
        <div id="message" class="alert hidden" role="status"></div>
        <section class="card" aria-labelledby="usersHeading">
          <h2 id="usersHeading">User access management</h2>
          <p class="page-intro">Update account roles and access status.</p>
          <div style="overflow-x: auto;">
            <table class="order-history-table">
              <thead>
                <tr>
                  <th scope="col">User ID</th>
                  <th scope="col">Name</th>
                  <th scope="col">Email</th>
                  <th scope="col">Role</th>
                  <th scope="col">Status</th>
                  <th scope="col">Registered</th>
                  <th scope="col">Manage</th>
                </tr>
              </thead>
              <tbody id="adminUsers">
                <tr><td class="order-history-state" colspan="7">Loading users...</td></tr>
              </tbody>
            </table>
          </div>
        </section>
      </main>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/pages/admin.js"></script>
</body>
</html>
