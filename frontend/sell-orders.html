<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sell Orders | Green Forest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
</head>
<body data-page="sell-orders" data-layout="nursery">
  <div class="app-layout">
    <aside class="sidebar" id="nurserySidebar"></aside>

    <div class="main">
      <header class="topbar">
        <h1>Sell Orders</h1>
      </header>

      <div class="content">
        <div id="message" class="alert hidden"></div>

        <!-- Sell Orders Table Card -->
        <div class="card sell-orders-card">
          <table class="sell-orders-table">
            <thead>
              <tr>
                <th scope="col">Order ID</th>
                <th scope="col">Customer</th>
                <th scope="col">Plant</th>
                <th scope="col">Quantity</th>
                <th scope="col">Total Price</th>
                <th scope="col">Order Date</th>
                <th scope="col">Status</th>
                <th scope="col">Action</th>
              </tr>
            </thead>
            <tbody id="sellOrdersTableBody">
              <tr>
                <td colspan="8" class="order-history-state">Loading sell orders...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/pages/sell-orders.js"></script>
</body>
</html>
