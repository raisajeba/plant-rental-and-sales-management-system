<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nursery Profile | Green Forest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
</head>
<body data-page="nursery-profile" data-layout="nursery">
  <div class="app-layout">
    <aside class="sidebar" id="nurserySidebar"></aside>

    <div class="main">
      <header class="topbar">
        <h1>Nursery Profile Settings</h1>
      </header>

      <div class="content">
        <div id="message" class="alert hidden"></div>

        <div class="card" style="padding: 2rem; max-width: 600px;">
          <form id="profileForm">
            <div class="form-group">
              <label for="nurseryName">Nursery Name</label>
              <input type="text" id="nurseryName" required />
            </div>
            <div class="form-group">
              <label for="ownerEmail">Owner Email</label>
              <input type="email" id="ownerEmail" />
            </div>
            <div class="form-group">
              <label for="contactNumber">Contact Number</label>
              <input type="text" id="contactNumber" placeholder="+880..." required />
            </div>
            <div class="form-group">
              <label for="city">City</label>
              <input type="text" id="city" required />
            </div>
            <div class="form-group">
              <label for="location">Location / Address</label>
              <textarea id="location" rows="2" placeholder="Nursery address..." required></textarea>
            </div>
            <button type="submit" class="btn btn-primary" style="background: #0d3b1e; color: #fff; margin-top: 1rem;">Save Changes</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/pages/nursery-profile.js"></script>
</body>
</html>
