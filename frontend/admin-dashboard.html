<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin Dashboard | GreenNest</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/admin-auth.css" />
</head>
<body class="admin-dashboard-page">
  <header class="navbar bg-white border-bottom">
    <div class="container d-flex justify-content-between">
      <a class="admin-brand" href="admin-dashboard.html">
        <span class="admin-brand-mark" aria-hidden="true">G</span>
        <span>GreenNest <span class="text-secondary fw-normal">Admin</span></span>
      </a>
      <button class="btn btn-outline-success" id="adminLogoutButton" type="button">Sign out</button>
    </div>
  </header>
  <main class="container py-4 py-md-5">
    <div class="mb-4">
      <p class="text-uppercase small fw-semibold text-success mb-2">Administration</p>
      <h1 class="h2 mb-2">User management</h1>
      <p class="text-secondary mb-0">Review GreenNest accounts, keep their status up to date, and approve new sign-ups.</p>
    </div>
    <div id="adminMessage" class="alert d-none" role="alert" aria-live="polite"></div>
    <section class="card border-0 shadow-sm">
      <div class="card-header bg-white py-3">
        <div class="d-flex flex-column flex-md-row align-items-md-center justify-content-between gap-3">
          <div class="d-flex align-items-center gap-3">
            <h2 class="h5 mb-0">Accounts</h2>
            <div class="d-flex align-items-center gap-2">
              <label class="small text-secondary mb-0" for="userStatusFilter">Filter</label>
              <select id="userStatusFilter" class="form-select form-select-sm w-auto">
                <option value="all">All</option>
                <option value="active">Active</option>
                <option value="inactive">Inactive</option>
                <option value="blocked">Blocked</option>
              </select>
            </div>
          </div>
          <button class="btn btn-sm btn-outline-secondary" id="refreshUsersButton" type="button">Refresh</button>
        </div>
      </div>
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead class="table-light">
            <tr>
              <th scope="col">Name</th>
              <th scope="col">Email</th>
              <th scope="col">Role</th>
              <th scope="col">Status</th>
              <th scope="col">Action</th>
            </tr>
          </thead>
          <tbody id="adminUsers">
            <tr><td colspan="5" class="text-secondary text-center py-4">Loading accounts…</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>
  <script src="js/admin_auth.js"></script>
</body>
</html>
