<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>About Us | Green Forest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
</head>
<body data-page="about" data-layout="dashboard">
  <div class="app-layout">
    <aside class="sidebar" id="sidebar"></aside>

    <div class="main">
      <header class="topbar"><h1>About Us</h1></header>

      <div class="content">
        <div id="message" class="alert hidden"></div>

        <section class="banner">
          <h2 id="aboutTitle">About Green Forest</h2>
          <p id="aboutTagline">Loading...</p>
        </section>

        <div class="grid-2">
          <section class="card">
            <h3>Who we are</h3>
            <p class="about-text" id="aboutDescription">Loading...</p>
          </section>

          <section class="card">
            <h3>Our mission</h3>
            <p class="about-text" id="aboutMission">Loading...</p>
          </section>
        </div>

        <section class="card section-gap">
          <h3>What you can do here</h3>
          <ul class="feature-list" id="aboutFeatures">
            <li>Loading...</li>
          </ul>
        </section>

        <section class="card section-gap">
          <h3>Get in touch</h3>
          <p class="about-text">
            Questions or feedback? Email us at
            <a id="aboutEmail" href="contact.html">our contact page</a>
            or <a href="contact.html">send us a message</a>.
          </p>
        </section>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/pages/about.js"></script>
</body>
</html>
