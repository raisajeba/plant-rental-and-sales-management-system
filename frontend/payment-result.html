<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payment Status | Green Forest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #f4f7f5;
      font-family: 'Nunito', sans-serif;
      margin: 0;
    }
    .result-card {
      background: #ffffff;
      padding: 2.5rem;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      text-align: center;
      max-width: 420px;
      width: 90%;
    }
    .status-icon {
      font-size: 3.5rem;
      margin-bottom: 1rem;
    }
    .result-card h2 {
      color: #1b4332;
      margin-bottom: 0.5rem;
      font-weight: 700;
    }
    .result-card p {
      color: #555555;
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 1.5rem;
    }
    .btn-dashboard {
      display: inline-block;
      padding: 0.75rem 1.75rem;
      background: #0f4d1f;
      color: #ffffff;
      text-decoration: none;
      border-radius: 6px;
      font-weight: 600;
      transition: background 0.2s ease;
      border: none;
      cursor: pointer;
      font-family: 'Nunito', sans-serif;
    }
    .btn-dashboard:hover {
      background: #14692b;
    }
  </style>
</head>
<body>
  <div class="result-card">
    <div id="icon" class="status-icon">⌛</div>
    <h2 id="title">Processing Payment...</h2>
    <p id="message">Please wait while we verify your transaction status.</p>
    <button id="actionBtn" class="btn-dashboard" style="display: none;">Go to Dashboard</button>
  </div>

  <script src="js/api.js"></script>
  <script>
    // Token recovery check (SSLCommerz redirect-er shomoy token lost howa theke bachanor jonno)
    const backupToken = sessionStorage.getItem("greennest_token_backup");
    if (backupToken && !localStorage.getItem("greennest_token")) {
      localStorage.setItem("greennest_token", backupToken);
    }

    const urlParams = new URLSearchParams(window.location.search);
    const status = urlParams.get("status");

    const icon = document.getElementById("icon");
    const title = document.getElementById("title");
    const message = document.getElementById("message");
    const actionBtn = document.getElementById("actionBtn");

    if (status === "success") {
      icon.textContent = "✅";
      title.textContent = "Payment Successful!";
      message.textContent = "Your payment has been confirmed successfully. Click below to view your dashboard.";
      actionBtn.style.display = "inline-block";
      actionBtn.textContent = "Go to Dashboard";
    } else if (status === "cancelled") {
      icon.textContent = "⚠️";
      title.textContent = "Payment Cancelled";
      message.textContent = "You have cancelled the payment process. You can retry anytime from your history.";
      actionBtn.style.display = "inline-block";
      actionBtn.textContent = "Back to Dashboard";
    } else {
      icon.textContent = "❌";
      title.textContent = "Payment Failed";
      message.textContent = "Something went wrong with your payment attempt. Please try again later.";
      actionBtn.style.display = "inline-block";
      actionBtn.textContent = "Back to Dashboard";
    }

    // Role-aware dynamic dashboard redirection on click
    actionBtn.addEventListener("click", async () => {
      actionBtn.disabled = true;
      actionBtn.textContent = "Redirecting...";
      try {
        const user = await apiRequest("/auth/me", { auth: true });
        const roleName = user && user.role ? user.role.role_name : "";

        if (roleName === "Nursery Owner") {
          window.location.href = "nursery-dashboard.html";
        } else if (roleName === "Admin") {
          window.location.href = "admin-dashboard.html";
        } else {
          window.location.href = "dashboard.html";
        }
      } catch (err) {
        // Fallback to customer dashboard or login if token is invalid
        window.location.href = "dashboard.html";
      }
    });
  </script>
</body>
</html>
