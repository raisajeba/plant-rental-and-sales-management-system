<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rent Plants | Green Forest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
</head>
<body data-page="rent" data-layout="dashboard">
  <div class="app-layout">
    <aside class="sidebar" id="sidebar"></aside>

    <div class="main">
      <header class="topbar">
        <h1>Rent Plants</h1>
      </header>
      
      <div class="content">
        <div id="message" class="alert hidden"></div>

<!-- Search & Description -->
        <div class="rent-toolbar">
          <p class="catalog-intro">Explore plants available for rent. Prices are per day.</p>
          <div style="position: relative; display: inline-block; width: 100%; max-width: 300px;">
            <!-- Search Icon SVG -->
            <svg style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; fill: #666; pointer-events: none;" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
            </svg>
            <input type="text" id="searchInput" placeholder="Search plants to rent..." aria-label="Search plants to rent" style="width: 100%; padding-left: 36px;" />
          </div>
        </div>
        <!-- Rent Plants Grid Container -->
        <div id="rentPlantsGrid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 1.5rem;">
          <div class="card" style="padding: 1.5rem; text-align: center; color: #666;">Loading plants for rent...</div>
        </div>
      </div>
    </div>
  </div>

  <dialog class="plant-quick-view" id="plantQuickViewDialog" aria-labelledby="quickViewTitle">
    <div class="quick-view-header">
      <p class="buy-cart-eyebrow">A CLOSER LOOK</p>
      <button class="buy-cart-close" id="closeQuickViewButton" type="button" aria-label="Close plant details">×</button>
    </div>
    
    <div class="quick-view-body">
      <img class="quick-view-image" id="quickViewImage" alt="" />
      <div class="quick-view-details">
        <p class="quick-view-category" id="quickViewCategory"></p>
        <h2 id="quickViewTitle"></h2>
        <p class="quick-view-nursery" id="quickViewNursery"></p>
        <p class="quick-view-price" id="quickViewPrice"></p>
        <dl class="quick-view-facts">
          <div><dt>Care guide</dt><dd id="quickViewCare"></dd></div>
          <div><dt>Availability</dt><dd id="quickViewStock"></dd></div>
        </dl>
        <form class="quick-view-rent-form" id="quickViewRentForm">
          <label>Quantity<input id="quickViewQuantity" type="number" min="1" value="1" required /></label>
          <label>Start date<input id="quickViewStartDate" type="date" required /></label>
          <label>End date<input id="quickViewEndDate" type="date" required /></label>
          <button class="btn btn-primary" id="quickViewAction" type="submit">Request Rent</button>
        </form>

        <!-- Reviews Section inside Quick View Modal -->
        <div class="quick-view-reviews-section" style="margin-top: 1.5rem; border-top: 1px solid #eee; padding-top: 1rem;">
          <h3 style="font-size: 1rem; color: #1b4332; margin-bottom: 0.5rem;">Customer Reviews</h3>
          <div class="reviews-list-container" style="max-height: 150px; overflow-y: auto; margin-bottom: 8px; font-size: 13px; color: #555;">
            <p class="no-reviews-text">Loading reviews...</p>
          </div>
          <form class="inline-review-form" id="quickViewReviewForm">
            <select class="review-rating-select" style="padding: 4px; font-size: 12px; margin-bottom: 5px; width: 100%; border-radius: 4px; border: 1px solid #ccc;">
              <option value="5">★★★★★ (5)</option>
              <option value="4">★★★★ (4)</option>
              <option value="3">★★★ (3)</option>
              <option value="2">★★ (2)</option>
              <option value="1">★ (1)</option>
            </select>
            <input type="text" class="review-comment-input" placeholder="Write a review..." style="width: 100%; padding: 6px; font-size: 12px; border: 1px solid #ccc; border-radius: 4px; margin-bottom: 5px;" required />
            <button type="submit" class="btn btn-primary" style="padding: 4px 10px; font-size: 11px;">Submit Review</button>
          </form>
        </div>

      </div>
    </div>
  </dialog>

  <script src="js/app.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/pages/rent.js"></script>
</body>
</html>
