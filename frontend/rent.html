<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rent Plants | Green Forest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
</head>
<body data-page="rent" data-layout="dashboard">
  <div class="app-layout">
    <aside class="sidebar" id="sidebar"></aside>

    <div class="main">
      <header class="topbar">
        <h1>Rent Plants</h1>
      </header>
      
      <div class="content">
        <div id="message" class="alert hidden"></div>

        <!-- Search & Description -->
        <div class="rent-toolbar">
          <p class="catalog-intro">Explore plants available for rent. Prices are per day.</p>
          <input type="text" id="searchInput" placeholder="Search plants to rent..." aria-label="Search plants to rent" />
        </div>
        <!-- Rent Plants Grid Container -->
        <div id="rentPlantsGrid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 1.5rem;">
          <div class="card" style="padding: 1.5rem; text-align: center; color: #666;">Loading plants for rent...</div>
        </div>
      </div>
    </div>
  </div>

  <dialog class="plant-quick-view" id="plantQuickViewDialog" aria-labelledby="quickViewTitle">
    <div class="quick-view-header">
      <p class="buy-cart-eyebrow">A CLOSER LOOK</p>
      <button class="buy-cart-close" id="closeQuickViewButton" type="button" aria-label="Close plant details">×</button>
    </div>
    <div class="quick-view-body">
      <img class="quick-view-image" id="quickViewImage" alt="" />
      <div class="quick-view-details">
        <p class="quick-view-category" id="quickViewCategory"></p>
        <h2 id="quickViewTitle"></h2>
        <p class="quick-view-nursery" id="quickViewNursery"></p>
        <p class="quick-view-price" id="quickViewPrice"></p>
        <dl class="quick-view-facts">
          <div><dt>Care guide</dt><dd id="quickViewCare"></dd></div>
          <div><dt>Availability</dt><dd id="quickViewStock"></dd></div>
        </dl>
        <form class="quick-view-rent-form" id="quickViewRentForm">
          <label>Quantity<input id="quickViewQuantity" type="number" min="1" value="1" required /></label>
          <label>Start date<input id="quickViewStartDate" type="date" required /></label>
          <label>End date<input id="quickViewEndDate" type="date" required /></label>
          <button class="btn btn-primary" id="quickViewAction" type="submit">Request Rent</button>
        </form>
      </div>
    </div>
  </dialog>

  <script src="js/app.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/pages/rent.js"></script>
</body>
</html>
