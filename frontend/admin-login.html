<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin Login | GreenNest</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/admin-auth.css" />
</head>
<body class="admin-auth-page">
  <main class="container min-vh-100 d-flex align-items-center justify-content-center py-4">
    <section class="card admin-auth-card shadow-sm w-100" aria-labelledby="adminLoginTitle">
      <div class="card-body p-4 p-md-5">
        <a class="admin-brand" href="landing_index.html" aria-label="GreenNest home">
          <span class="admin-brand-mark" aria-hidden="true">G</span>
          <span>GreenNest</span>
        </a>
        <p class="text-uppercase small fw-semibold text-success mt-4 mb-2">Administration</p>
        <h1 class="h3 mb-2" id="adminLoginTitle">Sign in to your admin account</h1>
        <p class="text-secondary mb-4">Use your authorized administrator credentials to continue.</p>

        <div id="adminMessage" class="alert d-none" role="alert" aria-live="polite"></div>

        <form id="adminLoginForm">
          <div class="mb-3">
            <label for="adminEmail" class="form-label">Email address</label>
            <input type="email" class="form-control form-control-lg" id="adminEmail"
                   name="email" autocomplete="username" required />
          </div>
          <div class="mb-4">
            <label for="adminPassword" class="form-label">Password</label>
            <input type="password" class="form-control form-control-lg" id="adminPassword"
                   name="password" autocomplete="current-password" required />
          </div>
          <button type="submit" class="btn btn-success btn-lg w-100" id="adminLoginButton">
            Sign in
          </button>
        </form>
        <a class="d-inline-block mt-4 small text-secondary" href="landing_index.html">Return to GreenNest</a>
      </div>
    </section>
  </main>
  <script src="js/admin_auth.js"></script>
</body>
</html>
